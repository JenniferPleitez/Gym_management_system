# Puerto en el que correrá la aplicación
server.port=8080

spring.application.name=${DATABASE_NAME}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# FLYWAY PARA MIGRACIONES (usará un USER con permisos DDL)
spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=true
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.datasource.dbcp2.test-while-idle=true
spring.datasource.dbcp2.validation-query=select 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#logging.level.org.springframework.security=INFO
#logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Endpoints que se exponen
management.endpoints.web.exposure.include=health,info,prometheus

# Base path de los endpoints
management.endpoints.web.base-path=/actuator

# Puerto solo para acuator
management.server.port=8081

# Habilitar exportación Prometheus
management.prometheus.metrics.export.enabled=true

# Histogramas detallados para métricas HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true

#TOKEN PREPERTIES (PREFIXES AND TTLS)
token.verify-prefix=${VERIFY_PREFIX}
token.pwd-reset-token-prefix=${PWDRESET_TOKEN_PREFIX}
token.user-version-key=${USER_VERSION_KEY}
token.verify-token-prefix=${VERIFY_TOKEN_PREFIX}
token.pwd-reset-prefix=${PWDRESET_PREFIX}
token.verify-token-ttl=${TOKEN_REDIS_TTL}
token.access-token-ttl=${ACCESS_TOKEN_TTL}
token.parellel-window=${PARELLEL_WINDOW}
token.refresh-replaced-key=${REFRESH_REPLACED_KEY}
token.refresh-hash-key=${REFRESH_HASH_KEY}
token.refresh-ids-prefix=${REFRESH_IDS_PREFIX}
token.refresh-token-ttl=${REFRESH_TOKEN_TTL}

#RATE LIMITING PROPERTIES (PREFIXES AND TTLS)
rate-limit.login-fail-limit=${MAX_FAILED_LOGINS}
rate-limit.login-fail-prefix=${LOGIN_FAIL_PREFIX}
rate-limit.login-fail-window=${FAILED_LOGIN_WINDOW_MINUTES}
rate-limit.pwd-reset-prefix=${PWD_RESET_PREFIX}
rate-limit.pwd-reset-limit=${PWD_RESET_MAX_REQUESTS}
rate-limit.pwd-reset-window=${PWD_RESET_REQUEST_WINDOW_MINUTES}
rate-limit.ip-prefix=${IP_PREFIX}
rate-limit.ip-limit=${IP_MAX_REQUESTS}
rate-limit.global-prefix=${GLOBAL_PREFIX}
rate-limit.ip-window=${IP_WINDOW_MINUTES}
rate-limit.verify-email-prefix=${VERIFY_EMAIL_PREFIX}
rate-limit.verify-email-limit=${VERIFY_EMAIL_MAX_REQUESTS}
rate-limit.verify-email-window=${VERIFY_EMAIL_WINDOW_MINUTES}
rate-limit.change-password-limit=${CHANGE_PASSWORD_MAX_REQUESTS}
rate-limit.change-password-prefix=${CHANGE_PASSWORD_PREFIX}
rate-limit.change-password-window=${CHANGE_PASSWORD_WINDOW_MINUTES}

#Account cache properties (PREFIX AND TTL)
account.cache-prefix=${ACCOUNT_CACHE_PREFIX}
account.cache-ttl=${ACCOUNT_TTL_MINUTES}
account.global-prefix=${ACCOUNT_GLOBAL_PREFIX}
account.id-prefix=${ACCOUNT_ID_PREFIX}

# Google Auth properties
google.auth.client-id=${GOOGLE_CLIENT_ID}
google.auth.client-secret=${GOOGLE_CLIENT_SECRET}