global: 
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}' 
  smtp_from: '${SMTP_FROM}' 
  smtp_auth_username: '${SMTP_USER}' 
  smtp_auth_password: '${SMTP_PASS}' 
  smtp_require_tls: true 
  
route: 
  receiver: 'default-email' 
  group_wait: 30s 
  group_interval: 1m 
  repeat_interval: 1h 

receivers: 
  - name: 'default-email' 
    email_configs: 
      - to: '${ALERT_RECEIVER_EMAIL}' 
        send_resolved: true