global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true

route:
  group_by: ['alertname','service','severity']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h
  receiver: 'slack-or-email'
  routes:
    - match:
        severity: critical
      #receiver: 'pager'   # pager / pagerduty. TODO: habilitar cuando tengamos pagerduty
      receiver: 'slack-or-email' # temporalmente lo dejamos así
      continue: false
    - match:
        severity: warning
      receiver: 'slack'
      continue: true

receivers:
  - name: 'slack'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#gym-cache-alerts'
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        send_resolved: true

  - name: 'slack-or-email'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#gym-cache-alerts'
        send_resolved: true
    email_configs:
      - to: '${ALERT_RECEIVER_EMAIL}'
        send_resolved: true

  - name: 'pager'
    # use pagerduty_configs or webhook to integrate with PagerDuty
    # pagerduty_configs: ...

templates:
  - '/etc/alertmanager/template/*.tmpl'
